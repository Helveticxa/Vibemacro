name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo version
        shell: pwsh
        run: |
          $cargo = Get-Content -LiteralPath .\Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"')
          if (-not $match.Success) { throw 'Cargo version tidak ditemukan' }
          $expected = "v$($match.Groups[1].Value)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME tidak cocok dengan $expected"
          }

      - name: Scan repository for leaked credentials
        shell: pwsh
        run: .\tools\security-scan.ps1 -IncludeHistory

      - name: Test and build release assets
        shell: pwsh
        # GitHub-hosted Windows runners tidak memiliki desktop interaktif untuk
        # SendInput/focus E2E. Test tersebut wajib dijalankan lokal sebelum tag.
        run: .\tools\build-release.ps1 -SkipDesktopE2E

      - name: Publish verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $parsed = [version]$version
          # Catatan rilis mengikuti versi, bukan path tetap, agar tag baru tidak
          # pernah diam-diam mempublikasikan catatan rilis lama.
          $notes = ".\docs\RELEASE-v$($parsed.Major).$($parsed.Minor).md"
          if (-not (Test-Path $notes)) { throw "Catatan rilis $notes tidak ditemukan" }
          gh release create $env:GITHUB_REF_NAME `
            ".\dist\Vibemacro-Setup-$version-x64.exe" `
            ".\dist\Vibemacro-$version-portable.exe" `
            ".\dist\vibemacro-update.txt" `
            ".\dist\SHA256SUMS.txt" `
            --verify-tag `
            --latest `
            --title "Vibemacro $version" `
            --notes-file $notes
