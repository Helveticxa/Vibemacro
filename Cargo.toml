[package]
name = "vibemacro"
version = "1.1.0"
edition = "2024"
description = "Timer dan macro Windows-native yang ringan, aman, dan vendor-neutral"
license = "MIT"
repository = "https://github.com/Helveticxa/Vibemacro"
homepage = "https://github.com/Helveticxa/Vibemacro"

[lib]
name = "vibemacro_core"
path = "src/lib.rs"

[[bin]]
name = "Vibemacro"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
